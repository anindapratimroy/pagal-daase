<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Lost in Space | DAASE</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Merriweather:ital,wght@0,300;0,700;1,300&display=swap" rel="stylesheet">
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #00050d;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .stars {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 160px 120px, #ddd, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 200px 200px;
      animation: twinkle 5s infinite;
      opacity: 0.5;
      z-index: 1;
    }
    @keyframes twinkle {
      0% { opacity: 0.3; } 50% { opacity: 0.6; } 100% { opacity: 0.3; }
    }
    .content {
      position: relative;
      z-index: 10;
      padding: 50px 40px;
      background: rgba(0, 15, 35, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      max-width: 450px;
      margin: 20px;
    }
    .error-code {
      font-size: 110px;
      font-weight: 700;
      margin: 0;
      background: linear-gradient(135deg, #ffffff 0%, #ffcc00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(255, 204, 0, 0.3);
      line-height: 1;
    }
    .title {
      font-family: 'Merriweather', serif;
      font-size: 24px;
      font-style: italic;
      margin: 20px 0;
      color: #e0e0e0;
    }
    .desc {
      font-size: 15px;
      color: #9aa0a6;
      line-height: 1.6;
      margin-bottom: 35px;
    }
    .btn {
      display: inline-block;
      padding: 14px 28px;
      background: transparent;
      color: #ffcc00;
      border: 1px solid #ffcc00;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn:hover {
      background: #ffcc00;
      color: #000;
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="stars"></div>
  <div class="content">
    <h1 class="error-code">404</h1>
    <h2 class="title">Lost in Space</h2>
    <p class="desc">The page you are looking for has drifted beyond the observable universe, or our servers are currently experiencing a solar flare.<br><br>Let's guide you back to safety.</p>
    <a href="/" class="btn">Return to Earth</a>
  </div>
</body>
</html>
